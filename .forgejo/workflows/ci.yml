name: CI

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps + pre-commit
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  semgrep:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        run: |
          semgrep --config=auto \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --sarif=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ cli/ --exit-non-zero-on-fix || echo "Ruff lint issues found (non-blocking)"
        continue-on-error: true
      - name: Ruff format check
        run: ruff format --check backend/ cli/ || echo "Ruff format issues found (non-blocking)"
        continue-on-error: true

  typecheck:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          pip install mypy -e ".[dev]" 2>/dev/null || pip install mypy
      - name: MyPy type check (non-blocking)
        run: |
          mypy . --strict --ignore-missing-imports --no-incremental 2>&1 | tail -20 || echo "Mypy issues found (non-blocking)"
        continue-on-error: true

  test:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates
          rm -rf /var/lib/apt/lists/*
          pip install -e ".[dev]" 2>/dev/null || pip install .
      - name: Run pytest with coverage
        continue-on-error: true
        run: |
          pytest tests/ -x -q --tb=short --cov=walletpress --cov-report=xml:coverage.xml --cov-report=term 2>&1 || echo "Tests have known failures (non-blocking)"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.xml
          flags: unittests
          name: walletpress
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t walletpress-backend backend/ || echo "Docker build requires Docker daemon"

  security:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets) — MUST block
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks detect --source . --no-banner --exit-code 1 --verbose --config .gitleaks.toml

  bandit:
    runs-on: docker-x64
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST scan
        run: bandit -r backend/ cli/ -x tests/,__pycache__,.venv -ll -f json -o bandit-report.json || echo "Bandit issues found (non-blocking)"
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
