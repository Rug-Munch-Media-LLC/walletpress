[project]
name = "walletpress"
version = "1.1.0"
description = "Self-hosted multi-chain wallet generation & management. Open source, auditable, trustless."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rug Munch Media LLC"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "coincurve>=18.0.0",
    "ecdsa>=0.19.0",
    "base58>=2.1.1",
    "pynacl>=1.5.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "bip-utils>=2.9.0",
    "apscheduler>=3.10.0",
]

[project.urls]
homepage = "https://walletpress.cc"
repository = "https://github.com/cryptorugmuncher/walletpress"
documentation = "https://docs.walletpress.cc"

[project.scripts]
walletpress = "walletpress_cli:main"
wp-verify-receipt = "cli.verify_receipt:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["walletpress*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "A", "C4", "SIM", "UP", "RUF", "S"]
extend-ignore = [
    "E402",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Tests may have imports after docstrings for setup convenience
"tests/*" = ["E402"]
# mcp_server uses local imports to break circular dependencies
"agent/mcp_server.py" = ["E402"]
"main.py" = ["E402"]
# routers/airdrop.py uses local imports for plugin isolation
"routers/airdrop.py" = ["E402"]
# plugins/__init__.py re-exports for plugin SDK public API
"plugins/__init__.py" = ["F401"]
# cli/verify_receipt.py — timestamp is a function parameter (F821 false positive)
"cli/verify_receipt.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    ".venv/",
]
warn_unused_ignores = false
# WalletPress was built without strict typing; enable incrementally.
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "call-arg",
    "dict-item",
    "index",
    "list-item",
    "return-value",
    "union-attr",
    "no-untyped-call",
    "no-untyped-def",
]

[[tool.mypy.overrides]]
module = [
    "coincurve",
    "coincurve.*",
    "ecdsa",
    "ecdsa.*",
    "base58",
    "base58.*",
    "nacl",
    "nacl.*",
    "cryptography",
    "cryptography.*",
    "bip_utils",
    "bip_utils.*",
    "apscheduler",
    "apscheduler.*",
    "bech32",
    "stellar_sdk",
    "stellar_sdk.*",
    "xrpl",
    "xrpl.*",
    "tonsdk",
    "bitcash",
    "monero",
    "substrate-interface",
]
ignore_missing_imports = true
