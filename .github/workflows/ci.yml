name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy . --strict --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # pytest-xdist (-n auto) + pytest-randomly (seeded via pyproject.toml)
      - run: python3 -m pytest tests/ -v --tb=short --cov --cov-report=term-missing -n auto

  # Mutation testing with cosmic-ray (replaces blocked mutmut).
  # Runs nightly or on manual dispatch. Installs cosmic-ray, initializes a
  # session DB, then executes mutations on wallet_engine/signature_verify.py.
  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install cosmic-ray
      - run: cosmic-ray init cosmic-ray.toml cosmic-ray.sqlite
      - run: cosmic-ray exec cosmic-ray.toml cosmic-ray.sqlite
      - name: Mutation results
        if: always()
        run: cosmic-ray report cosmic-ray.sqlite || true

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit safety
      - run: bandit -r . --quiet --skip=B101,B311
      - run: safety check

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-licenses
      - run: bash /home/dev/scripts/license-audit.sh
        continue-on-error: true

  gates:
    # Fleet coding gates (canonical: standards/fleet/gates). Firm <=200-line
    # ratchet + monkeypatch + antipattern ratchets; all steps BLOCKING.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structure gate (<=200 lines, shrink-only allowlist)
        run: python3 scripts/check-structure.py --repo . --scan-root backend --scan-root cli --scan-root walletpress-mcp
      - name: Monkeypatch ratchet (decrease-only)
        run: python3 scripts/check-monkeypatch.py --repo .
      - name: Antipattern gate (per-repo ratchet)
        run: python3 scripts/check-antipatterns.py --repo .
      - name: Gate self-test (prove gates catch violations)
        run: bash scripts/ci-gate-selftest.sh

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get diff
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
      - name: AI Review
        env:
          OPENAI_API_KEY: ${{ secrets.WP_AI_API_KEY }}
        run: |
          curl -s ${{ secrets.WP_AI_BASE_URL || 'https://openrouter.ai/api/v1' }}/chat/completions \
            -H "Authorization: Bearer ${{ secrets.WP_AI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "${{ secrets.WP_AI_MODEL || 'openai/gpt-4o' }}",
              "messages": [
                {"role": "system", "content": "Review this PR diff. List bugs, security issues, AI hallucinations, and maintainability problems."},
                {"role": "user", "content": "'"$(cat /tmp/pr.diff)"'"}
              ]
            }' > /tmp/ai_review.json

  
