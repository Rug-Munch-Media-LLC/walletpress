name: CI

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]
  schedule:
    # Nightly deep scan (noseyparker + grype) — staggered fleet-wide.
    - cron: '45 3 * * *'

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + pre-commit + hook tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit ruff mypy
      - name: Run ALL pre-commit hooks on all files
        run: |
          # Skip: no-commit-to-branch (blocks main — local-dev hook only);
          # ruff/ruff-format/mypy/bandit/gitleaks (dedicated CI jobs cover
          # them with the right env); web3-safety/hallucination-check
          # (local ~/.local/bin scripts, absent in CI). The mirror keeps
          # catching hygiene + secret bypasses.
          SKIP=no-commit-to-branch,ruff,ruff-format,mypy,bandit,gitleaks,web3-safety,hallucination-check pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      # Full node image: includes git. Slim images have no git, so
      # checkout@v4 falls back to a REST download (no .git) and the
      # git-log-based commit check fails with 'not a git repository'.
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint + git
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  semgrep:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        run: |
          semgrep --config=auto \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --exclude='.forgejo/' \
            --exclude='.github/' \
            --sarif --output=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Setup Python
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python ruff
      - name: Ruff check (blocking)
        run: source .venv/bin/activate && ruff check backend/ cli/ --exit-non-zero-on-fix
      - name: Ruff format check
        continue-on-error: true
        run: source .venv/bin/activate && ruff format --check backend/ cli/

  typecheck:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          pip install mypy -e ".[dev]" 2>/dev/null || pip install mypy
      - name: MyPy type check (non-strict, non-blocking)
        run: |
          mypy . --ignore-missing-imports 2>&1 | tail -20 || echo "Mypy issues found (non-blocking)"
        continue-on-error: true

  test:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Setup Python + deps
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          # python -m pytest (not bare pytest): puts backend/ on sys.path
          # so the top-level `core` package resolves.
          python -m pytest tests/ -x -q --tb=short --cov=walletpress --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=60
      - name: Check coverage threshold
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'Coverage: {line_rate*100:.1f}%')
          if line_rate < 0.60:
              print('❌ Coverage below 60% threshold')
              exit(1)
          print('✅ Coverage threshold met')
          "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.xml
          flags: unittests
          name: walletpress
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image
        run: |
          docker build -t walletpress-backend backend/ || echo "Docker build requires Docker daemon"

  pip-audit:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pip-audit
          pip install -r backend/requirements.txt 2>/dev/null || true
      - name: Run pip-audit (blocking on HIGH/CRITICAL)
        run: |
          pip-audit --desc 2>&1 || { echo "❌ pip-audit found vulnerabilities — fix before merge"; exit 1; }

  security:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets) — MUST block
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks detect --source . --no-banner --exit-code 1 --verbose --config .gitleaks.toml

  bandit:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST scan
        run: bandit -r backend/ cli/ -x tests/,__pycache__,.venv -ll -f json -o bandit-report.json || echo "Bandit issues found (non-blocking)"
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  trivy-scan:
    runs-on: docker-x64
    needs: build
    container:
      image: node:22-bookworm
      # Docker socket (runner valid_volumes) so the image can be built; the
      # job container needs the docker CLI too (node images don't ship it).
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install docker CLI + trivy
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz | tar xz -C /tmp
          mv /tmp/docker/docker /usr/local/bin/docker
          # Pinned version via install.sh: resolves the correct asset name
          # and skips the "latest tag" API call.
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.57.1
      - name: Build image for scanning
        run: docker build -t walletpress:${{ github.sha }} ./backend
      - name: Run Trivy vulnerability scanner
        # trivy-action@0.28.0 does not exist (ref-not-found); binary + CLI.
        run: trivy image --format sarif --output trivy-results.sarif --exit-code 1 --severity CRITICAL,HIGH 'walletpress:${{ github.sha }}'
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  docker-lint:
    runs-on: docker-x64
    container:
      # node image: checkout@v4 is a node20 action (hadolint image had no node).
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install hadolint
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
      - name: Hadolint root Dockerfile
        run: hadolint --failure-threshold error Dockerfile
      - name: Hadolint backend Dockerfile
        run: hadolint --failure-threshold error backend/Dockerfile

  shellcheck:
    runs-on: docker-x64
    container:
      # localhost/ci-alpine-node:3.19 does not exist on this runner; node
      # image also satisfies checkout@v4's node20 requirement.
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar xJ -C /tmp
          mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/
      - name: ShellCheck all shell scripts
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -exec shellcheck -x {} +
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table backend/requirements.txt walletpress-mcp/pyproject.toml || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  # ─── Performance Smoke (k6) ──────────────────────────────────────────
  k6-smoke:
    # k6 needs a RUNNING backend to test against. In PR CI the full stack
    # would be required, and secrets are not available in PR context.
    # Runs on schedule against the live deployment instead.
    # Non-blocking (continue-on-error) until a test environment is
    # provisioned; graduate to blocking by removing continue-on-error.
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: docker-x64
    container:
      # node image: checkout@v4 is a node20 action (k6 image had no node).
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz -C /tmp
          mv /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Run k6 smoke test (only when target reachable)
        run: |
          TARGET="${{ vars.K6_TARGET_URL || 'http://localhost:8000' }}"
          if curl -sf --connect-timeout 5 --max-time 10 "$TARGET/api/v1/health" >/dev/null 2>&1; then
            k6 run tests/k6/smoke.js --summary-export=tests/k6/results/smoke-summary.json
          else
            echo "⚠️ $TARGET unreachable — skipping k6 (no test environment in CI; non-blocking)"
          fi
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  # ── Frontend Golden Pipeline: web-quality gate for static marketing pages ──
  # walletpress.cc serves static HTML (marketing/*.html + root legal pages).
  web-quality:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: HTMLHint — markup validation (BLOCKING)
        run: npx htmlhint@latest "marketing/**/*.html" "*.html"
      - name: Serve site
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 procps && rm -rf /var/lib/apt/lists/*
          python3 -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/marketing/index.html > /dev/null 2>&1 && echo "Server ready" && break
            sleep 1
          done
      - name: Install Chromium
        run: |
          npx playwright install chromium --with-deps 2>/dev/null || \
          (apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*)
      - name: Lighthouse CI on marketing pages (advisory — Chrome env pending)
        # Chrome in this container blocks the localhost load with an
        # interstitial (chrome-error://chromewebdata) despite chromeFlags.
        # htmlhint + lychee remain blocking; revisit when the Chrome env is
        # sorted (playwright headless-shell + container networking).
        continue-on-error: true
        run: |
          export CHROME_PATH=$(find /root/.cache/ms-playwright -name chrome -type f -path "*chrome-linux*" | head -1)
          npx @lhci/cli@0.15 autorun --config=./lighthouserc.json || echo "::warning::Lighthouse failed (advisory)"
      - name: Lychee link check (internal links)
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin lychee
          lychee --offline --no-progress --exclude-mail 'marketing/**/*.html' '*.html'

  # ── Changelog (git-cliff) ─────────────────────────────────────
  # Verify a changelog can be generated from conventional commits.
  # Runs in the ephemeral CI workspace, so the committed CHANGELOG.md
  # is never clobbered.
  changelog:
    runs-on: docker-x64
    needs: [lint]
    container:
      # python+node: pip for git-cliff; git for fetch-depth: 0.
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: pip install git-cliff
      - name: Verify changelog generation
        run: git-cliff --strip header -o CHANGELOG.md

  # ── SBOM (CycloneDX) ─────────────────────────────────────────────
  sbom:
    runs-on: docker-x64
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ── Keyless image signing (Cosign) ────────────────────────────────
  sign-image:
    runs-on: docker-x64
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
      - name: Pull build cache
        run: docker pull registry.rugmunch.io/walletpress:buildcache || echo "No cache image yet — building from scratch"
      - name: Build Docker image with cache
        run: |
          docker build \
            --cache-from registry.rugmunch.io/walletpress:buildcache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t registry.rugmunch.io/walletpress:${{ github.sha }} \
            ./backend
      - name: Push cache image
        run: |
          docker tag registry.rugmunch.io/walletpress:${{ github.sha }} registry.rugmunch.io/walletpress:buildcache
          docker push registry.rugmunch.io/walletpress:buildcache
      - name: Push release image
        run: docker push registry.rugmunch.io/walletpress:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: cosign sign --yes registry.rugmunch.io/walletpress:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.rugmunch.io/RugMunchMedia/walletpress/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.rugmunch.io" \
            registry.rugmunch.io/walletpress:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # ── Dependency freshness (libyear) ─────────────────────────────
  # Advisory: flags dependency drift vs. the pinned backend manifest.
  deps-freshness:
    runs-on: docker-x64
    continue-on-error: true
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install pip-tools libyear 2>/dev/null || true
          if [ -f backend/requirements.txt ]; then
            libyear --file backend/requirements.txt || echo "Dep freshness check noted"
          fi

  # ── Mutation testing (mutmut) ──────────────────────────────────
  # Informational only for now. Scoped to the core engine packages
  # (core/ + wallet_engine/) so runtime stays bounded; runs against
  # backend/tests via backend/pytest.ini.
  mutation-test:
    runs-on: docker-x64
    needs: test
    continue-on-error: true  # informational only for now
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + deps + mutmut
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]" mutmut
      - name: Mutation testing (scoped to core engine)
        run: source .venv/bin/activate && mutmut run --paths-to-mutate core/ wallet_engine/ --test-timeout 10 || echo "Mutation score noted (non-blocking)"
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mutation-report
          path: |
            backend/.mutmut-cache/
            backend/html/
