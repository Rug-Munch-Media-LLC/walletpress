[project]
name = "walletpress-mcp"
version = "1.0.0"
description = "Standalone MCP Server for WalletPress — connect any MCP client to your wallet engine"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x renamed FastMCP -> MCPServer; this server targets the v1 API
    "mcp>=1.30.0,<2",
    "httpx>=0.28.1",
]

[project.scripts]
walletpress-mcp = "walletpress_mcp:main"

[tool.setuptools]
# Two top-level modules: the MCP server and its transport layer.
# packages.find matched nothing (there are no subpackages), so a plain
#  used to ship no importable module at all.
py-modules = ["walletpress_mcp", "transport"]
