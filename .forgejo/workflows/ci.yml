name: CI

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  pre-commit-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps + pre-commit
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends git ca-certificates curl
          pip install pre-commit
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  semgrep:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan
        run: |
          semgrep --config=auto \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='.venv/' \
            --sarif=semgrep.sarif \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ cli/ --exit-non-zero-on-fix
      - name: Ruff format check
        run: ruff format --check backend/ cli/

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest tests/ -x -q --tb=short --cov=walletpress --cov-report=xml:coverage.xml --cov-report=term
        continue-on-error: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: walletpress
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t walletpress-backend backend/ || echo "Docker build requires Docker daemon"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks detect --source . --verbose

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and bandit
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pip
          pip3 install bandit
      - name: Bandit SAST scan
        run: bandit -r backend/ cli/ -x tests/,__pycache__,.venv -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
