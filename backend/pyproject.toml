[project]
name = "walletpress"
version = "1.1.0"
description = "Self-hosted multi-chain wallet generation & management. Open source, auditable, trustless."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rug Munch Media LLC"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Crypto deps pinned to EXACT versions (supply-chain hardening, 2026-09-02)
    "coincurve==21.0.0",
    "base58==2.1.1",
    "pynacl>=1.6.2",  # 1.5.0 had PYSEC-2026-1448/3002 (libsodium)
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
    "pycryptodomex==3.23.0",
    "bip-utils==2.12.1",
    "pycardano>=0.19.0",
    "cbor2>=5.6.5,<6.0.0",  # pycardano imports FrozenDict (removed in cbor2 6.0)
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.0",
    "python-jose[cryptography]>=3.3.0",  # tests import jose; was only in requirements.txt
    "structlog>=24.1.0",  # tests import structlog; was only in requirements.txt
    "bech32>=1.2.0",  # tests import bech32 (address vectors); transitive-only before
    "xrpl-py>=4.0.0",  # tests import xrpl (PyPI name is xrpl-py)
    "ecdsa>=0.19.2",  # transitive via bip-utils; 0.19.1 had PYSEC-2026-2467
]

[project.urls]
homepage = "https://walletpress.cc"
repository = "https://github.com/cryptorugmuncher/walletpress"
documentation = "https://docs.walletpress.cc"

[project.scripts]
walletpress = "walletpress_cli:main"
wp-verify-receipt = "cli.verify_receipt:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "bandit>=1.9.0",
    "semgrep>=1.176.0",
    "import-linter>=2.15",
    "vulture>=2.16",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.0",
    # Test-only: EVM message signing in tests (test_signature_verify, security-audit suite).
    # Exact-pinned: eth-account 0.14+ pulls eth-utils 6.x which breaks substrate-interface (needs eth_utils<6).
    "eth-account==0.13.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["walletpress*"]

[tool.ruff]
extend = "../../standards/templates/ruff-base.toml"
target-version = "py310"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
]

[tool.ruff.lint]
extend-select = ["A"]
extend-ignore = [
    "E402",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Tests may have imports after docstrings for setup convenience
# Test vault passwords and secrets are not real secrets
"tests/*" = ["E402", "S105", "S106", "S108"]
# mcp_server uses local imports to break circular dependencies
"agent/mcp_server.py" = ["E402"]
"main.py" = ["E402"]
# routers/airdrop.py uses local imports for plugin isolation
"routers/airdrop.py" = ["E402"]
# plugins/__init__.py re-exports for plugin SDK public API
"plugins/__init__.py" = ["F401"]
# cli/verify_receipt.py — timestamp is a function parameter (F821 false positive)
"cli/verify_receipt.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    ".venv/",
]
warn_unused_ignores = false
# WalletPress was built without strict typing; enable incrementally.
disable_error_code = [
    "arg-type",
    "attr-defined",
    "assignment",
    "call-arg",
    "dict-item",
    "index",
    "list-item",
    "return-value",
    "union-attr",
    "no-untyped-call",
    "no-untyped-def",
]

[[tool.mypy.overrides]]
module = [
    "coincurve",
    "coincurve.*",
    "base58",
    "base58.*",
    "nacl",
    "nacl.*",
    "cryptography",
    "cryptography.*",
    "bip_utils",
    "bip_utils.*",
    "apscheduler",
    "apscheduler.*",
    "bech32",
    "stellar_sdk",
    "stellar_sdk.*",
    "xrpl",
    "xrpl.*",
    "tonsdk",
    "bitcash",
    "monero",
    "substrate-interface",
]
ignore_missing_imports = true
